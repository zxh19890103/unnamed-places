<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiments Portal</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(52, 211, 153, 0.16), transparent 28%),
        radial-gradient(circle at top right, rgba(96, 165, 250, 0.14), transparent 24%),
        linear-gradient(180deg, #08111d 0%, #0f172a 48%, #111827 100%);
      color: #e5e7eb;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    #App {
      width: 100%;
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <div id="App"></div>
  <script type="module" src="./src/portal/main.tsx"></script>
</body>

</html>
