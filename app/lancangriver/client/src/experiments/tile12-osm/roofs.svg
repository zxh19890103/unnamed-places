<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">MVP roof styles</title>
  <desc id="desc">Simple profile sketches for flat, skillion, gabled, and hipped roofs.</desc>

  <rect width="100%" height="100%" fill="#f8fafc"/>

  <g transform="translate(40, 30)">
    <text x="0" y="0" dominant-baseline="hanging" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#111827">
      4 Roof Styles (MVP)
    </text>
    <text x="0" y="42" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563">
      Simple side-profile sketches for implementation planning
    </text>
  </g>

  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="240" height="280" rx="14" fill="#ffffff" stroke="#d1d5db"/>
    <text x="120" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#111827">flat</text>
    <rect x="52" y="172" width="136" height="88" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
    <line x1="52" y1="172" x2="188" y2="172" stroke="#374151" stroke-width="6"/>
    <line x1="52" y1="260" x2="188" y2="260" stroke="#6b7280" stroke-width="3"/>
  </g>

  <g transform="translate(300, 95)">
    <rect x="0" y="0" width="240" height="280" rx="14" fill="#ffffff" stroke="#d1d5db"/>
    <text x="120" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#111827">skillion</text>
    <polygon points="52,196 188,168 188,260 52,260" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
    <line x1="52" y1="196" x2="188" y2="168" stroke="#374151" stroke-width="6"/>
    <line x1="52" y1="260" x2="188" y2="260" stroke="#6b7280" stroke-width="3"/>
  </g>

  <g transform="translate(560, 95)">
    <rect x="0" y="0" width="240" height="280" rx="14" fill="#ffffff" stroke="#d1d5db"/>
    <text x="120" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#111827">gabled</text>
    <polygon points="52,204 120,150 188,204 188,260 52,260" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
    <polyline points="52,204 120,150 188,204" fill="none" stroke="#374151" stroke-width="6"/>
    <line x1="52" y1="260" x2="188" y2="260" stroke="#6b7280" stroke-width="3"/>
  </g>

  <g transform="translate(820, 95)">
    <rect x="0" y="0" width="240" height="280" rx="14" fill="#ffffff" stroke="#d1d5db"/>
    <text x="120" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#111827">hipped</text>
    <polygon points="52,206 86,172 154,172 188,206 188,260 52,260" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
    <polyline points="52,206 86,172 154,172 188,206" fill="none" stroke="#374151" stroke-width="6"/>
    <line x1="52" y1="260" x2="188" y2="260" stroke="#6b7280" stroke-width="3"/>
  </g>
</svg>
